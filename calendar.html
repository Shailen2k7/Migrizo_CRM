<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Migrizo CRM — Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  .cal-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-top: 16px; }
  .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .cal-title { font-size: 16px; font-weight: 700; }
  .cal-nav { display: flex; gap: 6px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-day-name { font-size: 11px; text-transform: uppercase; color: var(--text-3); font-weight: 600; text-align: center; padding: 8px 4px; }
  .cal-cell { min-height: 90px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 6px; display: flex; flex-direction: column; gap: 4px; }
  .cal-cell.empty { background: transparent; border: none; }
  .cal-cell.today { background: var(--primary-50); border-color: var(--primary-200); }
  .cal-date { font-size: 12px; font-weight: 600; color: var(--text-1); }
  .cal-evt { font-size: 10.5px; padding: 2px 5px; border-radius: 4px; background: var(--primary-50); color: var(--primary-hover); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  .cal-evt.payment { background: #FEF3C7; color: #92400E; }
  .cal-evt.consultation { background: #DBEAFE; color: #1E40AF; }
</style>
</head>
<body>

  <aside class="sidebar">
    <div class="logo"><div class="logo-mark">M</div><div class="logo-text">Migrizo</div></div>
    <nav class="nav">
      <a class="nav-item" href="index.html"><i data-lucide="layout-dashboard"></i><span>Dashboard</span></a>
      <a class="nav-item" href="leads.html"><i data-lucide="users"></i><span>Leads</span></a>
      <a class="nav-item" href="followups.html"><i data-lucide="calendar-clock"></i><span>Follow-ups</span></a>
      <a class="nav-item" href="payments.html"><i data-lucide="indian-rupee"></i><span>Payments</span></a>
      <a class="nav-item active" href="calendar.html"><i data-lucide="calendar"></i><span>Calendar</span></a>
      <a class="nav-item" href="reports.html"><i data-lucide="bar-chart-3"></i><span>Reports</span></a>
      <div class="nav-divider"></div>
      <a class="nav-item" href="ai-coo.html"><i data-lucide="sparkles"></i><span>AI COO</span></a>
      <a class="nav-item" href="settings.html"><i data-lucide="settings"></i><span>Settings</span></a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-card">
        <div class="user-avatar">—</div>
        <div class="user-meta"><div class="user-name">Loading...</div><div class="user-role">—</div></div>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="greeting">
        <h1>Calendar</h1>
        <p>All follow-ups in one view</p>
      </div>
      <div class="topbar-right">
        <button class="btn-add" onclick="location.href='followups.html'"><i data-lucide="plus" style="width:16px;height:16px"></i> New Follow-up</button>
      </div>
    </header>

    <section class="content">
      <div class="cal-wrap">
        <div class="cal-header">
          <div class="cal-title" id="calMonth">—</div>
          <div class="cal-nav">
            <button class="filter-btn" id="prevMonth"><i data-lucide="chevron-left"></i></button>
            <button class="filter-btn" id="todayBtn">Today</button>
            <button class="filter-btn" id="nextMonth"><i data-lucide="chevron-right"></i></button>
          </div>
        </div>
        <div class="cal-grid" id="calBody">
          <div style="grid-column:span 7" class="loading-block"><span class="spinner"></span> Loading...</div>
        </div>
      </div>
    </section>
  </main>

  <script src="assets/app.js"></script>
  <script src="assets/auth.js"></script>
  <script>
  let TASKS = [];
  let viewMonth = new Date();

  async function loadCalendar() {
    try {
      const resp = await CRM.tasks();
      TASKS = resp.tasks || [];
      render();
    } catch(err) {
      document.getElementById('calBody').innerHTML = `<div style="grid-column:span 7" class="loading-block" style="color:#DC2626">⚠️ ${err.message}</div>`;
    }
  }

  function render() {
    const m = viewMonth.getMonth(), y = viewMonth.getFullYear();
    document.getElementById('calMonth').textContent =
      viewMonth.toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });
    const firstDay = new Date(y, m, 1);
    const lastDay  = new Date(y, m + 1, 0);
    const startWeekday = firstDay.getDay();
    const daysInMonth = lastDay.getDate();
    const today = new Date(); today.setHours(0,0,0,0);

    // Map tasks by date
    const byDate = {};
    TASKS.forEach(t => {
      if (!t.due_date) return;
      const d = new Date(t.due_date);
      if (d.getMonth() === m && d.getFullYear() === y) {
        const day = d.getDate();
        (byDate[day] ||= []).push(t);
      }
    });

    let html = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d => `<div class="cal-day-name">${d}</div>`).join('');
    for (let i = 0; i < startWeekday; i++) html += '<div class="cal-cell empty"></div>';
    for (let d = 1; d <= daysInMonth; d++) {
      const cellDate = new Date(y, m, d);
      const isToday = cellDate.getTime() === today.getTime();
      const evts = byDate[d] || [];
      html += `<div class="cal-cell ${isToday ? 'today' : ''}">
        <div class="cal-date">${d}</div>
        ${evts.slice(0, 3).map(t => `<div class="cal-evt" title="${t.subject}">${fmt.time(t.due_date)} ${t.contact_name || t.subject}</div>`).join('')}
        ${evts.length > 3 ? `<div style="font-size:10.5px;color:var(--text-3)">+${evts.length - 3} more</div>` : ''}
      </div>`;
    }
    document.getElementById('calBody').innerHTML = html;
    if (window.lucide) lucide.createIcons();
  }

  document.getElementById('prevMonth').onclick = () => { viewMonth.setMonth(viewMonth.getMonth() - 1); render(); };
  document.getElementById('nextMonth').onclick = () => { viewMonth.setMonth(viewMonth.getMonth() + 1); render(); };
  document.getElementById('todayBtn').onclick  = () => { viewMonth = new Date(); render(); };

  requireAuth().then(s => { if (s) loadCalendar(); });
  </script>
</body>
</html>
