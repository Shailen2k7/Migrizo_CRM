<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Migrizo CRM — Leads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  .smart-toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
  .filter-btn { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text-1); font-weight: 500; font-size: 13px; cursor: pointer; }
  .filter-btn i { width: 14px; height: 14px; color: var(--text-3); }
  .leads-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; margin-top: 12px; overflow: hidden; }
  table.leads { width: 100%; border-collapse: collapse; }
  table.leads th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-3); font-weight: 600; padding: 12px; background: var(--bg); border-bottom: 1px solid var(--border); text-align: left; }
  table.leads td { padding: 14px 12px; border-bottom: 1px solid var(--divider); font-size: 13px; color: var(--text-1); }
  table.leads tbody tr:hover { background: var(--bg); }
  .stage-pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 600; cursor: pointer; border: 1px solid transparent; }
  .stage-pill:hover { background: var(--primary-50); }
  .score-circle { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--bg); border: 1px solid var(--border); font-weight: 700; font-size: 12px; color: var(--text-2); }
  .pagination { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-top: 1px solid var(--border); font-size: 12.5px; color: var(--text-2); }
</style>
</head>
<body>

  <aside class="sidebar">
    <div class="logo"><div class="logo-mark">M</div><div class="logo-text">Migrizo</div></div>
    <nav class="nav">
      <a class="nav-item" href="index.html"><i data-lucide="layout-dashboard"></i><span>Dashboard</span></a>
      <a class="nav-item active" href="leads.html"><i data-lucide="users"></i><span>Leads</span></a>
      <a class="nav-item" href="followups.html"><i data-lucide="calendar-clock"></i><span>Follow-ups</span></a>
      <a class="nav-item" href="payments.html"><i data-lucide="indian-rupee"></i><span>Payments</span></a>
      <a class="nav-item" href="calendar.html"><i data-lucide="calendar"></i><span>Calendar</span></a>
      <a class="nav-item" href="reports.html"><i data-lucide="bar-chart-3"></i><span>Reports</span></a>
      <div class="nav-divider"></div>
      <a class="nav-item" href="ai-coo.html"><i data-lucide="sparkles"></i><span>AI COO</span></a>
      <a class="nav-item" href="settings.html"><i data-lucide="settings"></i><span>Settings</span></a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-card">
        <div class="user-avatar">—</div>
        <div class="user-meta"><div class="user-name">Loading...</div><div class="user-role">—</div></div>
      </div>
      <button class="quick-add" id="quickAddLead" style="border:none;width:100%;text-align:left;cursor:pointer">
        <div class="quick-add-icon"><i data-lucide="plus" style="width:16px;height:16px"></i></div>
        <div class="quick-add-text"><strong>Quick Add Lead</strong><span>Add a new client</span></div>
      </button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="greeting">
        <h1>Leads</h1>
        <p>Manage your entire leads database</p>
      </div>
      <div class="topbar-right">
        <div class="search-box">
          <i data-lucide="search" class="search-icon" style="width:16px;height:16px"></i>
          <input type="text" placeholder="Search by name, phone, email..." id="leadSearch" />
        </div>
        <button class="btn-add" id="addLeadBtn"><i data-lucide="plus" style="width:16px;height:16px"></i> Add Lead</button>
      </div>
    </header>

    <section class="content">
      <div class="smart-toolbar">
        <button class="filter-btn" id="stageFilterBtn">
          <i data-lucide="filter"></i> <span>All Stages</span>
        </button>
        <select class="filter-btn" id="stageSelect" style="display:none">
          <option value="">All stages</option>
          <option>New Inquiry</option>
          <option>Attempted</option>
          <option>Connected</option>
          <option>Qualified</option>
          <option>Consultation</option>
          <option>Proposal</option>
          <option>Partial Pay</option>
          <option>Closed Won</option>
          <option>Closed Lost</option>
        </select>
        <div style="margin-left:auto;display:flex;gap:8px;align-items:center">
          <span style="font-size:12.5px;color:var(--text-2)">Total:</span>
          <strong id="totalCount" style="font-size:13px">—</strong>
          <button class="filter-btn" id="syncBtn" title="Sync from Bigin">
            <i data-lucide="refresh-cw"></i> <span>Sync</span>
          </button>
        </div>
      </div>

      <section class="leads-panel">
        <div style="overflow-x:auto">
          <table class="leads">
            <thead><tr>
              <th>Client</th>
              <th>Stage</th>
              <th>Phone</th>
              <th>Email</th>
              <th style="text-align:center">Score</th>
              <th>Payments</th>
              <th>Updated</th>
              <th style="width:80px"></th>
            </tr></thead>
            <tbody id="leadsBody">
              <tr><td colspan="8"><div class="loading-block"><span class="spinner"></span> Loading leads from Bigin...</div></td></tr>
            </tbody>
          </table>
        </div>
        <div class="pagination">
          <div id="paginationInfo">—</div>
        </div>
      </section>
    </section>
  </main>

  <script src="assets/app.js"></script>
  <script src="assets/auth.js"></script>
  <script>
  let LEADS = [];
  let FILTERED = [];
  let searchQuery = '';
  let stageFilter = '';

  async function loadLeads() {
    try {
      const data = await CRM.leads();
      LEADS = data.leads || [];
      applyFilters();
    } catch(err) {
      console.error(err);
      document.getElementById('leadsBody').innerHTML = `<tr><td colspan="8"><div class="loading-block" style="color:#DC2626">⚠️ ${err.message}</div></td></tr>`;
    }
  }

  function applyFilters() {
    FILTERED = LEADS.filter(l => {
      if (stageFilter && l.stage !== stageFilter) return false;
      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        if (!(l.full_name || '').toLowerCase().includes(q)
         && !(l.phone || '').toLowerCase().includes(q)
         && !(l.email || '').toLowerCase().includes(q)) return false;
      }
      return true;
    });
    renderLeads();
  }

  function renderLeads() {
    const body = document.getElementById('leadsBody');
    document.getElementById('totalCount').textContent = LEADS.length;
    document.getElementById('paginationInfo').textContent = FILTERED.length === 0
      ? 'No leads to show'
      : `Showing ${FILTERED.length} of ${LEADS.length} leads`;

    if (FILTERED.length === 0) {
      body.innerHTML = `<tr><td colspan="8">${emptyState({ icon:'users', title: LEADS.length === 0 ? 'No leads in Bigin yet' : 'No leads match your filter', message: LEADS.length === 0 ? 'Add your first lead, or click Sync to pull from Bigin.' : 'Try clearing the search or stage filter.', action: LEADS.length === 0 ? 'Add Lead' : null, actionId: 'emptyAdd' })}</td></tr>`;
      if (window.lucide) lucide.createIcons();
      const ea = document.getElementById('emptyAdd');
      if (ea) ea.onclick = openAddLeadModal;
      return;
    }

    body.innerHTML = FILTERED.map((l, i) => `
      <tr>
        <td>
          <div style="display:flex;align-items:center;gap:10px">
            <div class="avatar sm a${(i % 6) + 1}">${fmt.initials(l.full_name)}</div>
            <div>
              <div style="font-weight:600;color:var(--text-1)">${l.full_name || '—'}</div>
              <div style="font-size:11.5px;color:var(--text-3)">${l.owner_name || ''}</div>
            </div>
          </div>
        </td>
        <td>
          <span class="stage-pill" style="background:${stageColor(l.stage)}1A;color:${stageColor(l.stage)}" onclick="changeStage('${l.zoho_id}', '${(l.full_name || '').replace(/'/g, "\\'")}', '${l.stage || ''}')">
            ${l.stage || 'New Inquiry'} <i data-lucide="chevron-down" style="width:11px;height:11px"></i>
          </span>
        </td>
        <td>${l.phone ? `<a href="tel:${l.phone}" style="color:var(--text-1);text-decoration:none">${fmt.phone(l.phone)}</a>` : '—'}</td>
        <td>${l.email ? `<a href="mailto:${l.email}" style="color:var(--text-1);text-decoration:none;font-size:12.5px">${l.email}</a>` : '—'}</td>
        <td style="text-align:center"><span class="score-circle">${l.score || 0}</span></td>
        <td>
          ${l.total_fee > 0 ? `
            <div style="font-size:12px;color:var(--text-2)">${fmt.inr(l.amount_paid)} / ${fmt.inr(l.total_fee)}</div>
            <div class="progress-bar" style="margin-top:4px;width:100px;--p:${Math.round((l.amount_paid/l.total_fee)*100)}%;--c:#10B981"></div>
          ` : '—'}
        </td>
        <td style="font-size:12px;color:var(--text-3)">${fmt.dateShort(l.synced_at)}</td>
        <td>
          ${l.phone ? `<a href="tel:${l.phone}" class="filter-btn" style="padding:4px 8px;height:auto" title="Call"><i data-lucide="phone" style="width:14px;height:14px"></i></a>` : ''}
        </td>
      </tr>
    `).join('');
    if (window.lucide) lucide.createIcons();
  }

  function stageColor(stage) {
    const map = {
      'New Inquiry': '#94A3B8',
      'Attempted':   '#A5B4FC',
      'Connected':   '#818CF8',
      'Qualified':   '#6366F1',
      'Consultation':'#8B5CF6',
      'Proposal':    '#F59E0B',
      'Partial Pay': '#14B8A6',
      'Closed Won':  '#10B981',
      'Closed Lost': '#EF4444'
    };
    return map[stage] || '#94A3B8';
  }

  window.changeStage = function(leadId, leadName, currentStage) {
    openModal({
      title: 'Change Stage',
      submitLabel: 'Update in Bigin',
      width: 420,
      body: `
        <p style="font-size:13px;color:var(--text-2);margin:0 0 12px">Update stage for <strong>${leadName}</strong></p>
        <div class="form-group">
          <label class="form-label">New stage</label>
          <select class="form-select" id="cs_stage">
            ${['New Inquiry','Attempted','Connected','Qualified','Consultation','Proposal','Partial Pay','Closed Won','Closed Lost']
              .map(s => `<option ${s === currentStage ? 'selected' : ''}>${s}</option>`).join('')}
          </select>
        </div>
        <p class="form-hint">Note: Stage lives on the Deal record. If no Deal exists, one will be created automatically.</p>`,
      onSubmit: async () => {
        const newStage = document.getElementById('cs_stage').value;
        // Find or create the deal for this contact
        const dealsResp = await CRM.deals();
        const deal = (dealsResp.deals || []).find(d => d.contact_id === leadId);
        if (deal) {
          await CRM.updateDeal(deal.zoho_id, { Stage: newStage });
        } else {
          await CRM.addDeal({
            Deal_Name:    leadName + ' — Deal',
            Stage:        newStage,
            Contact_Name: { id: leadId },
            Amount:       0
          });
        }
        showToast('Stage updated');
        await loadLeads();
      }
    });
  };

  // ===== ADD LEAD MODAL =====
  function openAddLeadModal() {
    openModal({
      title: 'Add New Lead',
      submitLabel: 'Add to Bigin',
      width: 520,
      body: `
        <div class="form-group">
          <label class="form-label">Full Name *</label>
          <input class="form-input" id="al_name" placeholder="e.g. Rahul Kumar" />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Phone</label>
            <input class="form-input" id="al_phone" placeholder="+91 98XXX XXXXX" />
          </div>
          <div class="form-group">
            <label class="form-label">Email</label>
            <input class="form-input" id="al_email" type="email" placeholder="name@example.com" />
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Description</label>
          <textarea class="form-textarea" id="al_desc" placeholder="Source, what they're looking for..."></textarea>
        </div>`,
      onSubmit: async () => {
        const name  = document.getElementById('al_name').value.trim();
        const phone = document.getElementById('al_phone').value.trim();
        const email = document.getElementById('al_email').value.trim();
        const desc  = document.getElementById('al_desc').value.trim();
        if (!name) throw new Error('Name is required');
        const [first, ...rest] = name.split(' ');
        const last = rest.join(' ') || first;
        await CRM.addLead({
          First_Name:  first,
          Last_Name:   last,
          Phone:       phone || null,
          Email:       email || null,
          Description: desc || null
        });
        showToast('Lead created');
        await loadLeads();
      }
    });
  }
  document.getElementById('addLeadBtn').onclick = openAddLeadModal;
  document.getElementById('quickAddLead').onclick = openAddLeadModal;

  // Search
  document.getElementById('leadSearch').addEventListener('input', e => {
    searchQuery = e.target.value;
    applyFilters();
  });

  // Stage filter
  const stageBtn = document.getElementById('stageFilterBtn');
  const stageSel = document.getElementById('stageSelect');
  stageBtn.onclick = () => stageSel.style.display = stageSel.style.display === 'none' ? '' : 'none';
  stageSel.onchange = () => {
    stageFilter = stageSel.value;
    stageBtn.querySelector('span').textContent = stageFilter || 'All Stages';
    applyFilters();
  };

  // Sync button
  document.getElementById('syncBtn').onclick = async () => {
    const btn = document.getElementById('syncBtn');
    const orig = btn.innerHTML;
    btn.innerHTML = '<span class="spinner"></span> Syncing...';
    btn.disabled = true;
    try {
      const res = await CRM.sync();
      showToast(`Synced ${res.synced?.contacts || 0} contacts`);
      await loadLeads();
    } catch(e) {
      showToast('Sync failed: ' + e.message, 'error');
    }
    btn.innerHTML = orig;
    btn.disabled = false;
    if (window.lucide) lucide.createIcons();
  };

  // Auth & load
  requireAuth().then(s => { if (s) loadLeads(); });
  </script>
</body>
</html>
