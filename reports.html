<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Migrizo CRM — Reports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css?v=20260518">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  .chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
  @media (max-width: 1100px) { .chart-row { grid-template-columns: 1fr; } }
</style>
</head>
<body>

  <aside class="sidebar">
    <div class="logo"><div class="logo-mark">M</div><div class="logo-text">Migrizo</div></div>
    <nav class="nav">
      <a class="nav-item" href="index.html"><i data-lucide="layout-dashboard"></i><span>Dashboard</span></a>
      <a class="nav-item" href="leads.html"><i data-lucide="users"></i><span>Leads</span></a>
      <a class="nav-item" href="followups.html"><i data-lucide="calendar-clock"></i><span>Follow-ups</span></a>
      <a class="nav-item" href="payments.html"><i data-lucide="indian-rupee"></i><span>Payments</span></a>
      <a class="nav-item" href="calendar.html"><i data-lucide="calendar"></i><span>Calendar</span></a>
      <a class="nav-item active" href="reports.html"><i data-lucide="bar-chart-3"></i><span>Reports</span></a>
      <div class="nav-divider"></div>
      <a class="nav-item" href="ai-coo.html"><i data-lucide="sparkles"></i><span>AI COO</span></a>
      <a class="nav-item" href="settings.html"><i data-lucide="settings"></i><span>Settings</span></a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-card">
        <div class="user-avatar">—</div>
        <div class="user-meta"><div class="user-name">Loading...</div><div class="user-role">—</div></div>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="greeting">
        <h1>Reports</h1>
        <p>Insights from your real Bigin data</p>
      </div>
    </header>

    <section class="content" id="reportContent">
      <div class="loading-block"><span class="spinner"></span> Loading...</div>
    </section>
  </main>

  <script src="assets/app.js?v=20260518"></script>
  <script src="assets/auth.js?v=20260518"></script>
  <script>
  let LEADS = [];

  async function loadReports() {
    try {
      const r = await CRM.leads();
      LEADS = r.leads || [];
      render();
    } catch(err) {
      document.getElementById('reportContent').innerHTML = `<div class="loading-block" style="color:#DC2626">⚠️ ${err.message}</div>`;
    }
  }

  function render() {
    const content = document.getElementById('reportContent');
    if (LEADS.length === 0) {
      content.innerHTML = emptyState({ icon: 'bar-chart-3', title: 'No data to report on yet', message: 'Add leads or sync from Bigin to start seeing reports.', action: 'Go to Leads', actionId: 'goLeads' });
      if (window.lucide) lucide.createIcons();
      document.getElementById('goLeads').onclick = () => location.href = 'leads.html';
      return;
    }

    // KPIs
    const total       = LEADS.length;
    const closed      = LEADS.filter(l => l.stage === 'Closed Won').length;
    const totalPaid   = LEADS.reduce((s,l) => s + (parseFloat(l.amount_paid) || 0), 0);
    const totalFee    = LEADS.reduce((s,l) => s + (parseFloat(l.total_fee) || 0), 0);
    const convRate    = total > 0 ? ((closed/total) * 100).toFixed(1) : '0';
    const avgDeal     = closed > 0 ? totalPaid / closed : 0;

    content.innerHTML = `
      <div class="stat-grid">
        <div class="stat-card"><div class="stat-head"><span class="stat-label">Total Leads</span></div><div class="stat-value">${total}</div></div>
        <div class="stat-card"><div class="stat-head"><span class="stat-label">Closed Won</span></div><div class="stat-value">${closed}</div></div>
        <div class="stat-card"><div class="stat-head"><span class="stat-label">Conversion</span></div><div class="stat-value">${convRate}%</div></div>
        <div class="stat-card"><div class="stat-head"><span class="stat-label">Revenue</span></div><div class="stat-value">${fmt.inrShort(totalPaid)}</div></div>
        <div class="stat-card"><div class="stat-head"><span class="stat-label">Pipeline</span></div><div class="stat-value">${fmt.inrShort(totalFee - totalPaid)}</div></div>
        <div class="stat-card"><div class="stat-head"><span class="stat-label">Avg Deal</span></div><div class="stat-value">${fmt.inrShort(avgDeal)}</div></div>
      </div>
      <div class="chart-row">
        <div class="card">
          <div class="card-head"><h3 class="card-title">Leads by Stage</h3></div>
          <div class="card-body"><div class="chart-container" style="height:280px"><canvas id="stageChart"></canvas></div></div>
        </div>
        <div class="card">
          <div class="card-head"><h3 class="card-title">Lead Quality</h3></div>
          <div class="card-body"><div class="chart-container" style="height:280px"><canvas id="qualityChart"></canvas></div></div>
        </div>
      </div>
      <div class="chart-row">
        <div class="card" style="grid-column: span 2">
          <div class="card-head"><h3 class="card-title">Top Leads by Value</h3></div>
          <div class="card-body" id="topLeadsBody"></div>
        </div>
      </div>
    `;

    renderStageChart();
    renderQualityChart();
    renderTopLeads();
  }

  function renderStageChart() {
    const stages = ['New Inquiry','Attempted','Connected','Qualified','Consultation','Proposal','Partial Pay','Closed Won','Closed Lost'];
    const counts = stages.map(s => LEADS.filter(l => l.stage === s).length);
    new Chart(document.getElementById('stageChart'), {
      type: 'bar',
      data: { labels: stages, datasets: [{ data: counts, backgroundColor: '#6366F1', borderRadius: 6 }] },
      options: { responsive:true, maintainAspectRatio:false, plugins:{ legend:{display:false} },
        scales: { x: { ticks: { maxRotation: 30, minRotation: 30, font: { size: 10 } } }, y: { beginAtZero: true, ticks: { precision: 0 } } } }
    });
  }

  function renderQualityChart() {
    const buckets = { Hot:0, Warm:0, Cold:0, Unscored:0 };
    LEADS.forEach(l => {
      const s = parseInt(l.score) || 0;
      if (s === 0) buckets.Unscored++; else if (s >= 8) buckets.Hot++; else if (s >= 5) buckets.Warm++; else buckets.Cold++;
    });
    new Chart(document.getElementById('qualityChart'), {
      type: 'doughnut',
      data: { labels: Object.keys(buckets), datasets: [{ data: Object.values(buckets), backgroundColor: ['#EF4444','#F97316','#3B82F6','#94A3B8'], borderWidth: 0 }] },
      options: { responsive:true, maintainAspectRatio:false, cutout:'65%' }
    });
  }

  function renderTopLeads() {
    const top = [...LEADS].sort((a,b) => (b.total_fee || 0) - (a.total_fee || 0)).slice(0, 10);
    document.getElementById('topLeadsBody').innerHTML = top.length === 0
      ? '<p style="color:var(--text-3);font-size:13px">No deals with amounts yet</p>'
      : `<table class="leads" style="width:100%">
          <thead><tr><th>Lead</th><th>Stage</th><th>Total Fee</th><th>Paid</th></tr></thead>
          <tbody>${top.map((l,i) => `<tr>
            <td><div style="display:flex;align-items:center;gap:8px"><div class="avatar sm a${(i%6)+1}">${fmt.initials(l.full_name)}</div>${l.full_name}</div></td>
            <td><span class="badge blue">${l.stage}</span></td>
            <td><strong>${fmt.inr(l.total_fee)}</strong></td>
            <td>${fmt.inr(l.amount_paid)}</td>
          </tr>`).join('')}</tbody>
        </table>`;
  }

  requireAuth().then(s => { if (s) loadReports(); });
  </script>
</body>
</html>
