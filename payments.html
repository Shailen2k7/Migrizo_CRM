<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Migrizo CRM — Payments</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  .pay-table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 12px; overflow: hidden; border: 1px solid var(--border); margin-top: 16px; }
  .pay-table th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-3); font-weight: 600; padding: 12px; background: var(--bg); text-align: left; border-bottom: 1px solid var(--border); }
  .pay-table td { padding: 14px 12px; border-bottom: 1px solid var(--divider); font-size: 13px; }
  .pay-table tbody tr:hover { background: var(--bg); }
</style>
</head>
<body>

  <aside class="sidebar">
    <div class="logo"><div class="logo-mark">M</div><div class="logo-text">Migrizo</div></div>
    <nav class="nav">
      <a class="nav-item" href="index.html"><i data-lucide="layout-dashboard"></i><span>Dashboard</span></a>
      <a class="nav-item" href="leads.html"><i data-lucide="users"></i><span>Leads</span></a>
      <a class="nav-item" href="followups.html"><i data-lucide="calendar-clock"></i><span>Follow-ups</span></a>
      <a class="nav-item active" href="payments.html"><i data-lucide="indian-rupee"></i><span>Payments</span></a>
      <a class="nav-item" href="calendar.html"><i data-lucide="calendar"></i><span>Calendar</span></a>
      <a class="nav-item" href="reports.html"><i data-lucide="bar-chart-3"></i><span>Reports</span></a>
      <div class="nav-divider"></div>
      <a class="nav-item" href="ai-coo.html"><i data-lucide="sparkles"></i><span>AI COO</span></a>
      <a class="nav-item" href="settings.html"><i data-lucide="settings"></i><span>Settings</span></a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-card">
        <div class="user-avatar">—</div>
        <div class="user-meta"><div class="user-name">Loading...</div><div class="user-role">—</div></div>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="greeting">
        <h1>Payments</h1>
        <p>Track milestone payments and revenue pipeline</p>
      </div>
      <div class="topbar-right">
        <button class="btn-add" id="recordPayBtn"><i data-lucide="plus" style="width:16px;height:16px"></i> Record Payment</button>
      </div>
    </header>

    <section class="content">
      <div class="stat-grid">
        <div class="stat-card"><div class="stat-head"><span class="stat-label">Pipeline Value</span><span class="stat-icon-tiny"><i data-lucide="layers"></i></span></div><div class="stat-value" id="kPipeline">—</div></div>
        <div class="stat-card"><div class="stat-head"><span class="stat-label">Collected</span><span class="stat-icon-tiny green"><i data-lucide="wallet"></i></span></div><div class="stat-value" id="kCollected">—</div></div>
        <div class="stat-card"><div class="stat-head"><span class="stat-label">Pending</span><span class="stat-icon-tiny violet"><i data-lucide="hourglass"></i></span></div><div class="stat-value" id="kPending">—</div></div>
        <div class="stat-card"><div class="stat-head"><span class="stat-label">Active Deals</span><span class="stat-icon-tiny blue"><i data-lucide="receipt"></i></span></div><div class="stat-value" id="kDeals">—</div></div>
      </div>

      <div id="dealsList" style="margin-top:16px">
        <div class="loading-block"><span class="spinner"></span> Loading deals from Bigin...</div>
      </div>
    </section>
  </main>

  <script src="assets/app.js"></script>
  <script src="assets/auth.js"></script>
  <script>
  let DEALS = [];

  async function loadDeals() {
    try {
      const resp = await CRM.deals();
      DEALS = resp.deals || [];
      render();
    } catch(err) {
      document.getElementById('dealsList').innerHTML = `<div class="loading-block" style="color:#DC2626">⚠️ ${err.message}</div>`;
    }
  }

  function render() {
    const totalFee  = DEALS.reduce((s,d) => s + d.total_fee, 0);
    const collected = DEALS.reduce((s,d) => s + d.amount_paid, 0);
    const pending   = totalFee - collected;

    document.getElementById('kPipeline').textContent  = fmt.inrShort(totalFee);
    document.getElementById('kCollected').textContent = fmt.inrShort(collected);
    document.getElementById('kPending').textContent   = fmt.inrShort(pending);
    document.getElementById('kDeals').textContent     = DEALS.length;

    const list = document.getElementById('dealsList');
    if (DEALS.length === 0) {
      list.innerHTML = emptyState({ icon: 'receipt', title: 'No deals yet', message: 'When you create deals in Bigin (or move leads through the pipeline), they\'ll appear here.' });
      if (window.lucide) lucide.createIcons();
      return;
    }

    list.innerHTML = `
      <table class="pay-table">
        <thead><tr>
          <th>Client / Deal</th>
          <th>Stage</th>
          <th>Total Fee</th>
          <th>Paid</th>
          <th>Pending</th>
          <th>% Complete</th>
          <th style="width:120px"></th>
        </tr></thead>
        <tbody>
          ${DEALS.map((d, i) => `
            <tr>
              <td>
                <div style="display:flex;align-items:center;gap:10px">
                  <div class="avatar sm a${(i % 6) + 1}">${fmt.initials(d.contact_name || d.deal_name)}</div>
                  <div>
                    <div style="font-weight:600">${d.contact_name || '—'}</div>
                    <div style="font-size:11.5px;color:var(--text-3)">${d.deal_name}</div>
                  </div>
                </div>
              </td>
              <td><span class="badge ${stageBadge(d.stage)}">${d.stage}</span></td>
              <td><strong>${fmt.inr(d.total_fee)}</strong></td>
              <td style="color:#10B981;font-weight:600">${fmt.inr(d.amount_paid)}</td>
              <td style="color:${(d.total_fee - d.amount_paid) > 0 ? '#F59E0B' : '#94A3B8'};font-weight:600">${fmt.inr(d.total_fee - d.amount_paid)}</td>
              <td>
                <div style="display:flex;align-items:center;gap:8px">
                  <div class="progress-bar" style="width:80px;--p:${d.pct_paid}%;--c:${d.pct_paid >= 100 ? '#10B981' : '#6366F1'}"></div>
                  <span style="font-size:12px">${d.pct_paid}%</span>
                </div>
              </td>
              <td><button class="btn-secondary" style="padding:6px 10px;font-size:12px" onclick="recordForDeal('${d.zoho_id}','${(d.deal_name || '').replace(/'/g, "\\'")}', ${d.total_fee}, ${d.amount_paid})">Record</button></td>
            </tr>
          `).join('')}
        </tbody>
      </table>`;
  }

  function stageBadge(stage) {
    if (stage === 'Closed Won') return 'green';
    if (stage === 'Closed Lost') return 'red';
    if (stage === 'Partial Pay') return 'amber';
    return 'blue';
  }

  window.recordForDeal = function(dealId, dealName, totalFee, alreadyPaid) {
    openModal({
      title: 'Record Payment',
      submitLabel: 'Save to Bigin',
      width: 460,
      body: `
        <p style="font-size:13px;color:var(--text-2);margin:0 0 12px"><strong>${dealName}</strong></p>
        <p style="font-size:12px;color:var(--text-3);margin-bottom:14px">Total: ${fmt.inr(totalFee)} · Paid so far: ${fmt.inr(alreadyPaid)}</p>
        <div class="form-group">
          <label class="form-label">Amount received (₹)</label>
          <input class="form-input" id="p_amount" type="number" placeholder="0" />
        </div>
        <div class="form-group">
          <label class="form-label">New stage (optional)</label>
          <select class="form-select" id="p_stage">
            <option value="">— Don't change —</option>
            <option>Partial Pay</option>
            <option>Closed Won</option>
          </select>
        </div>
        <p class="form-hint">Updates Amount_Paid__c on the Bigin deal. If that custom field doesn't exist, it will be ignored.</p>`,
      onSubmit: async () => {
        const amt = parseFloat(document.getElementById('p_amount').value);
        const stg = document.getElementById('p_stage').value;
        if (!amt || amt <= 0) throw new Error('Enter a valid amount');
        const newPaid = alreadyPaid + amt;
        const updates = { Amount_Paid__c: newPaid };
        if (stg) updates.Stage = stg;
        await CRM.updateDeal(dealId, updates);
        showToast('Payment recorded');
        await loadDeals();
      }
    });
  };

  document.getElementById('recordPayBtn').onclick = () => {
    if (DEALS.length === 0) {
      showToast('Create a deal first by moving a lead through the pipeline', 'info');
      return;
    }
    showToast('Click "Record" on any deal in the table below', 'info');
  };

  requireAuth().then(s => { if (s) loadDeals(); });
  </script>
</body>
</html>
