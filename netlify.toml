[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # @supabase/supabase-js deprecates Node 20 and below. Netlify's default image
  # is older than this, so pin it or the build warns now and breaks later.
  NODE_VERSION = "22"

# No [[plugins]] block on purpose.
#
# Netlify detects Next.js and installs its runtime automatically. Declaring
# @netlify/plugin-nextjs explicitly while it is absent from package.json makes
# the build depend on Netlify resolving it from the plugin registry, which fails
# on some accounts with "Failed to install plugins" — before a single line of
# app code is compiled. Auto-detection has no such failure mode.
