<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Migrizo CRM — Follow-ups</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  .fu-card { display: flex; align-items: center; gap: 14px; padding: 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
  .fu-card.overdue { border-left: 3px solid #EF4444; }
  .fu-card.today { border-left: 3px solid #F59E0B; }
  .fu-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--primary-50); color: var(--primary-hover); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; }
  .fu-body { flex: 1; min-width: 0; }
  .fu-title { font-size: 14px; font-weight: 600; color: var(--text-1); margin-bottom: 2px; }
  .fu-meta { font-size: 12px; color: var(--text-3); display: flex; gap: 10px; flex-wrap: wrap; }
  .fu-actions { display: flex; gap: 6px; }
  .fu-list { display: flex; flex-direction: column; gap: 10px; }
  .fu-section-title { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-3); font-weight: 600; margin: 18px 0 8px; }
</style>
</head>
<body>

  <aside class="sidebar">
    <div class="logo"><div class="logo-mark">M</div><div class="logo-text">Migrizo</div></div>
    <nav class="nav">
      <a class="nav-item" href="index.html"><i data-lucide="layout-dashboard"></i><span>Dashboard</span></a>
      <a class="nav-item" href="leads.html"><i data-lucide="users"></i><span>Leads</span></a>
      <a class="nav-item active" href="followups.html"><i data-lucide="calendar-clock"></i><span>Follow-ups</span></a>
      <a class="nav-item" href="payments.html"><i data-lucide="indian-rupee"></i><span>Payments</span></a>
      <a class="nav-item" href="calendar.html"><i data-lucide="calendar"></i><span>Calendar</span></a>
      <a class="nav-item" href="reports.html"><i data-lucide="bar-chart-3"></i><span>Reports</span></a>
      <div class="nav-divider"></div>
      <a class="nav-item" href="ai-coo.html"><i data-lucide="sparkles"></i><span>AI COO</span></a>
      <a class="nav-item" href="settings.html"><i data-lucide="settings"></i><span>Settings</span></a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-card">
        <div class="user-avatar">—</div>
        <div class="user-meta"><div class="user-name">Loading...</div><div class="user-role">—</div></div>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="greeting">
        <h1>Follow-ups</h1>
        <p>Track and complete every follow-up from one place</p>
      </div>
      <div class="topbar-right">
        <button class="btn-add" id="addTaskBtn"><i data-lucide="plus" style="width:16px;height:16px"></i> New Follow-up</button>
      </div>
    </header>

    <section class="content">
      <div class="stat-grid">
        <div class="stat-card"><div class="stat-head"><span class="stat-label">Overdue</span><span class="stat-icon-tiny orange"><i data-lucide="alert-circle"></i></span></div><div class="stat-value" id="kOverdue">—</div></div>
        <div class="stat-card"><div class="stat-head"><span class="stat-label">Today</span><span class="stat-icon-tiny"><i data-lucide="calendar-check"></i></span></div><div class="stat-value" id="kToday">—</div></div>
        <div class="stat-card"><div class="stat-head"><span class="stat-label">Upcoming</span><span class="stat-icon-tiny blue"><i data-lucide="calendar"></i></span></div><div class="stat-value" id="kUpcoming">—</div></div>
        <div class="stat-card"><div class="stat-head"><span class="stat-label">Completed</span><span class="stat-icon-tiny green"><i data-lucide="check-circle"></i></span></div><div class="stat-value" id="kDone">—</div></div>
      </div>

      <div id="taskList" style="margin-top:16px">
        <div class="loading-block"><span class="spinner"></span> Loading from Bigin...</div>
      </div>
    </section>
  </main>

  <script src="assets/app.js"></script>
  <script src="assets/auth.js"></script>
  <script>
  let TASKS = [], LEADS = [];

  async function loadAll() {
    try {
      const [tResp, lResp] = await Promise.all([
        CRM.tasks(),
        CRM.leads().catch(() => ({ leads: [] }))
      ]);
      TASKS = tResp.tasks || [];
      LEADS = lResp.leads || [];
      render();
    } catch(err) {
      document.getElementById('taskList').innerHTML = `<div class="loading-block" style="color:#DC2626">⚠️ ${err.message}</div>`;
    }
  }

  function render() {
    const today    = new Date(); today.setHours(0,0,0,0);
    const tomorrow = new Date(today); tomorrow.setDate(tomorrow.getDate() + 1);

    const overdue   = TASKS.filter(t => t.due_date && t.status !== 'Completed' && new Date(t.due_date) < today);
    const todayList = TASKS.filter(t => t.due_date && t.status !== 'Completed' && new Date(t.due_date) >= today && new Date(t.due_date) < tomorrow);
    const upcoming  = TASKS.filter(t => t.due_date && t.status !== 'Completed' && new Date(t.due_date) >= tomorrow);
    const done      = TASKS.filter(t => t.status === 'Completed');

    document.getElementById('kOverdue').textContent  = overdue.length;
    document.getElementById('kToday').textContent    = todayList.length;
    document.getElementById('kUpcoming').textContent = upcoming.length;
    document.getElementById('kDone').textContent     = done.length;

    const list = document.getElementById('taskList');
    if (TASKS.length === 0) {
      list.innerHTML = emptyState({ icon: 'calendar-clock', title: 'No follow-ups yet', message: 'Create your first follow-up task. It will sync to Bigin Tasks.', action: 'New Follow-up', actionId: 'emptyAdd' });
      if (window.lucide) lucide.createIcons();
      document.getElementById('emptyAdd').onclick = openAddTask;
      return;
    }

    let html = '';
    if (overdue.length) html += renderSection('Overdue', overdue, 'overdue');
    if (todayList.length) html += renderSection('Today', todayList, 'today');
    if (upcoming.length) html += renderSection('Upcoming', upcoming, '');
    if (done.length) html += renderSection('Completed (recent)', done.slice(0, 10), '');
    list.innerHTML = html;
    if (window.lucide) lucide.createIcons();
  }

  function renderSection(title, tasks, cls) {
    return `<div class="fu-section-title">${title} (${tasks.length})</div>
      <div class="fu-list">
        ${tasks.map(t => `
          <div class="fu-card ${cls}">
            <div class="fu-avatar">${fmt.initials(t.contact_name)}</div>
            <div class="fu-body">
              <div class="fu-title">${t.subject || 'Follow-up'}</div>
              <div class="fu-meta">
                <span>${t.contact_name || '—'}</span>
                <span>•</span>
                <span>${fmt.date(t.due_date)} ${fmt.time(t.due_date)}</span>
                ${t.priority ? `<span>•</span><span>Priority: ${t.priority}</span>` : ''}
              </div>
            </div>
            <div class="fu-actions">
              ${t.status !== 'Completed' ? `<button class="btn-secondary" style="padding:6px 10px;font-size:12px" onclick="markDone('${t.zoho_id}', this)">Mark Done</button>` : `<span style="font-size:12px;color:var(--text-3)">✓ Completed</span>`}
            </div>
          </div>`).join('')}
      </div>`;
  }

  window.markDone = async function(id, btn) {
    btn.disabled = true; btn.textContent = '...';
    try {
      await CRM.completeTask(id);
      showToast('Marked complete');
      await loadAll();
    } catch(e) { showToast(e.message, 'error'); btn.disabled = false; btn.textContent = 'Mark Done'; }
  };

  function openAddTask() {
    openModal({
      title: 'New Follow-up',
      submitLabel: 'Create in Bigin',
      width: 480,
      body: `
        <div class="form-group">
          <label class="form-label">Subject *</label>
          <input class="form-input" id="t_subject" placeholder="e.g. Call about visa documents" />
        </div>
        <div class="form-group">
          <label class="form-label">Linked Lead</label>
          <select class="form-select" id="t_contact">
            <option value="">— None —</option>
            ${LEADS.map(l => `<option value="${l.zoho_id}">${l.full_name}</option>`).join('')}
          </select>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Due Date *</label>
            <input class="form-input" id="t_date" type="date" />
          </div>
          <div class="form-group">
            <label class="form-label">Priority</label>
            <select class="form-select" id="t_priority">
              <option>Normal</option><option>High</option><option>Highest</option><option>Low</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Notes</label>
          <textarea class="form-textarea" id="t_desc"></textarea>
        </div>`,
      onSubmit: async () => {
        const subject = document.getElementById('t_subject').value.trim();
        const contactId = document.getElementById('t_contact').value;
        const date = document.getElementById('t_date').value;
        const priority = document.getElementById('t_priority').value;
        const desc = document.getElementById('t_desc').value.trim();
        if (!subject) throw new Error('Subject is required');
        if (!date)    throw new Error('Due date is required');
        const payload = {
          Subject:     subject,
          Due_Date:    date,
          Priority:    priority,
          Status:      'Not Started',
          Description: desc || null
        };
        if (contactId) payload.Who_Id = { id: contactId };
        await CRM.addTask(payload);
        showToast('Follow-up created');
        await loadAll();
      }
    });
  }
  document.getElementById('addTaskBtn').onclick = openAddTask;

  requireAuth().then(s => { if (s) loadAll(); });
  </script>
</body>
</html>
